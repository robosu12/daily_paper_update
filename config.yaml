# TODO: add papers by configuration file
base_url: "https://arxiv.paperswithcode.com/api/v0/papers/"
user_name: "robosu12"
repo_name: "daily_paper_update"
show_authors: True
show_links: True
show_badge: True
max_results: 10
openreview_search_limit: 50

# paper sources
sources:
    arxiv: True
    openreview: True
    semantic_scholar: True

# 机器人顶会顶刊；检索词自动汇总下方 keywords，无需重复维护
top_venues:
    enabled: True
    title: "机器人顶会顶刊"
    max_results: 30
    venues:
        "ICRA":
            - "IEEE International Conference on Robotics and Automation"
            - "International Conference on Robotics and Automation"
            - "ICRA"
        "IROS":
            - "IEEE/RSJ International Conference on Intelligent Robots and Systems"
            - "IEEE International Conference on Intelligent Robots and Systems"
            - "International Conference on Intelligent Robots and Systems"
            - "IROS"
        "RAL": ["IEEE Robotics and Automation Letters"]
        "RAS": ["Robotics and Autonomous Systems"]
        "TRO": ["IEEE Transactions on Robotics"]
        "TFR": ["IEEE Transactions on Field Robotics"]

publish_readme: True
publish_gitpage: True
publish_wechat: False

# file paths
json_readme_path: './docs/cv-arxiv-daily.json'
json_gitpage_path: './docs/cv-arxiv-daily-web.json'
json_wechat_path: './docs/cv-arxiv-daily-wechat.json'

md_readme_path: 'README.md'
md_gitpage_path: './docs/index.md'
md_wechat_path: './docs/wechat.md'

# keywords to search
keywords:
    "LiDAR SLAM": 
        filters: ["LiDAR SLAM", "LiDAR Odometry", "LiDAR-inertial Odometry", "LiDAR-Visual-inertial Odometry"]
    "Visual SLAM":
        filters: ["Visual SLAM", "Visual Odometry", "Visual-inertial Odometry"]
    "Loop Closure":
        filters: ["Place recognition", "Relocalization", "Loop Closure", "Global Feature Matching"]
    "3DGS":
        filters: ["3DGS", "Gaussian Splatting"]
    "Image Matching":
        filters: ["Keypoint Detection", "Feature Descriptor", "Image Matching", "Stereo Matching", "Local Feature Matching"]

